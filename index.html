<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark/light mode">
        <span id="themeIcon">🌙</span>
    </button>
    <div class="pages" id="pages">
        <div class="page calc-page">
            <h1>Basic Calculator</h1>
            <input type="number" id="num1" placeholder="Enter first number">
            <input type="number" id="num2" placeholder="Enter second number">
            <div class="buttons">
                <button onclick="calculate('+')">+</button>
                <button onclick="calculate('-')">−</button>
                <button onclick="calculate('*')">×</button>
                <button onclick="calculate('/')">÷</button>
            </div>
            <div id="result">
                Result: -
            </div>
            <button class="history-btn" onclick="goToHistory()">History</button>
        </div>
        <div class="page history-page">
            <div class="history-page-header">
                <button class="back-btn" onclick="goToCalculator()" aria-label="Back to calculator">←</button>
                <h2>History</h2>
                <button class="clear-btn" onclick="clearHistory()">Clear</button>
            </div>
            <ul id="historyList" class="history-list"></ul>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
